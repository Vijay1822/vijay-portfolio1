[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The contact email is intentionally public (shown on the site, resume, and README),
# so exclude these non-secret keys from secrets scanning.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "CONTACT_DESTINATION_EMAIL,FROM_EMAIL"
