<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Netlify Forms Pre-Render</title>
  </head>
  <body>
    <!-- 
      This static form is required by Netlify Forms bot crawler at build time for Next.js App Router.
      It enables native Netlify Forms processing and email notifications to mamidalavijay04@gmail.com.
    -->
    <form
      name="contact"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
